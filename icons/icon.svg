<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- фон: глубокий цвет морской волны -->
  <rect width="512" height="512" rx="116" fill="#0F7D8A"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)" opacity="0.16"/>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#04323a"/>
    </linearGradient>
  </defs>

  <!-- вилка, переходящая в лист -->
  <g fill="none" stroke="#F2F7F7" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 128v92"/>
    <path d="M216 128v92"/>
    <path d="M144 174h96"/>
    <path d="M192 220v60c0 26-10 42-30 52"/>
  </g>

  <!-- лист -->
  <path d="M316 176c62 30 78 104 26 166-62-16-92-88-26-166z" fill="#F2F7F7"/>
  <path d="M318 322c14-44 12-86-2-128" fill="none" stroke="#0F7D8A" stroke-width="12" stroke-linecap="round"/>

  <!-- акцент: морковная точка -->
  <circle cx="372" cy="140" r="26" fill="#E4572E"/>
</svg>
